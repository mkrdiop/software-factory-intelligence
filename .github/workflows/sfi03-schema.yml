name: SFI-03 schema conformance

on:
  push:
    paths:
      - "schemas/v1/**"
      - "fixtures/v1/**"
      - "scripts/validate_sfi03.py"
      - "requirements-dev.txt"
      - ".github/workflows/sfi03-schema.yml"
  pull_request:
    paths:
      - "schemas/v1/**"
      - "fixtures/v1/**"
      - "scripts/validate_sfi03.py"
      - "requirements-dev.txt"
      - ".github/workflows/sfi03-schema.yml"

permissions:
  contents: read

jobs:
  validate-sfi03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate schema and fixtures
        run: python scripts/validate_sfi03.py
